services:
  # All-in-One Service: Bundled React Frontend + FastAPI Backend
  - type: web
    name: disease-detection-platform
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: hybrid_qml_db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
