services:
  # Backend Web Service using Docker
  - type: web
    name: disease-detection-backend
    env: docker
    plan: free
    rootDir: Diseases_Detection_Paltform/backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8000
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB
        value: hybrid_qml_db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
  # Frontend Static Site
  - type: web
    name: disease-detection-frontend
    env: static
    rootDir: Diseases_Detection_Paltform/frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://disease-detection-backend.onrender.com/api/v1
        sync: false
      - key: NODE_VERSION
        value: 20
